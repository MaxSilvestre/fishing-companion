[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fishing-companion"
version = "0.1.0"
description = "Personal fishing dashboard: daily activity scores for favorite spots and species."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maxime" }]
dependencies = [
    "httpx>=0.27",
    "astral>=3.2",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
